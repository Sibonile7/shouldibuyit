<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - German Car Reliability</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav><div class="nav-inner"><a href="/" class="logo">german car reliability</a><div class="nav-links"><a href="/">Search</a><a href="/static/compare.html">Compare</a><a href="/static/top.html">Top ranked</a></div></div></nav>
    <main>
        <div id="back-link" class="back-link"></div>
        <div id="page-header" class="page-detail-header"></div>
        <div id="complaints-list" class="complaints-page-list">
            <div class="loading">Loading complaints...</div>
        </div>
        <div id="pagination" class="pagination"></div>
    </main>
    <footer>
        <div class="data-limitations">
            <div class="samples-title">Data limitations</div>
            Based on US NHTSA data. Complaints are owner-reported and not independently verified. Not adjusted for number of cars sold.
        </div>
        <div class="footer-source">Source: NHTSA. Public domain. Data last updated: May 2025.</div>
    </footer>
    <script src="/static/app.js"></script>
    <script>
        const PER_PAGE = 10;

        function getParams() {
            const p = new URLSearchParams(window.location.search);
            return {
                make: p.get("make") || "",
                model: p.get("model") || "",
                year: p.get("year") || "",
                component: p.get("component") || "ALL",
                page: parseInt(p.get("page")) || 1,
            };
        }

        function buildUrl(params, page) {
            return `/static/complaints.html?make=${params.make}&model=${params.model}&year=${params.year}&component=${params.component}&page=${page}`;
        }

        async function loadPage() {
            const params = getParams();
            const offset = (params.page - 1) * PER_PAGE;

            document.getElementById("back-link").innerHTML =
                `<a href="/?make=${params.make}&model=${params.model}&year=${params.year}">← Back to ${params.year} ${esc(params.make)} ${esc(params.model)}</a>`;

            const url = `/api/car/${params.make}/${params.model}/${params.year}/component/${params.component}?limit=${PER_PAGE}&offset=${offset}`;
            const res = await fetch(url);

            if (!res.ok) {
                document.getElementById("complaints-list").innerHTML = '<div class="loading">No complaints found.</div>';
                return;
            }

            const data = await res.json();
            const totalPages = Math.ceil(data.total_matching / PER_PAGE);
            const componentLabel = params.component === "ALL" ? "All complaints" : esc(params.component) + " complaints";

            document.getElementById("page-header").innerHTML = `
                <h1 class="detail-title">${params.year} ${esc(params.make)} ${esc(params.model)}</h1>
                <div class="detail-subtitle">${componentLabel}: ${data.total_matching} total</div>
                ${params.component !== "ALL" ? `<a href="${buildUrl({...params, component: 'ALL'}, 1)}" class="filter-reset-link">Show all complaints</a>` : ''}
            `;

            const activeFilter = params.component !== "ALL" ? params.component : null;
            document.getElementById("complaints-list").innerHTML = data.complaints.map(c => {
                const tags = [];
                if (c.crash) tags.push('<span class="sample-crash">CRASH</span>');
                if (c.fire) tags.push('<span class="sample-crash">FIRE</span>');
                if (c.injuries && c.injuries > 0) tags.push(`<span class="sample-crash">${c.injuries} INJ</span>`);
                const pills = splitComponents(c.component).map(part => {
                    const match = activeFilter && cleanComponent(part) === activeFilter;
                    return `<span class="${match ? 'sample-tag sample-tag-match' : 'sample-tag'}">${esc(part)}</span>`;
                }).join('');
                return `<div class="sample">${esc(c.summary)}<div class="sample-meta">${tags.join('')}${pills}${c.date_filed ? `<span class="sample-tag">${esc(c.date_filed)}</span>` : ''}</div></div>`;
            }).join('');

            // Build LinkedIn-style pagination
            let pagHTML = '';
            if (totalPages > 1) {
                // Previous
                if (params.page > 1) {
                    pagHTML += `<a href="${buildUrl(params, params.page - 1)}" class="pag-prev">‹ Previous</a>`;
                }

                pagHTML += '<div class="pag-numbers">';

                // Always show page 1
                if (params.page === 1) {
                    pagHTML += `<span class="pag-num pag-active">1</span>`;
                } else {
                    pagHTML += `<a href="${buildUrl(params, 1)}" class="pag-num">1</a>`;
                }

                // Dots after 1 if needed
                if (params.page > 4) {
                    pagHTML += `<span class="pag-dots">...</span>`;
                }

                // Middle pages
                const start = Math.max(2, params.page - 1);
                const end = Math.min(totalPages - 1, params.page + 1);
                for (let i = start; i <= end; i++) {
                    if (i === params.page) {
                        pagHTML += `<span class="pag-num pag-active">${i}</span>`;
                    } else {
                        pagHTML += `<a href="${buildUrl(params, i)}" class="pag-num">${i}</a>`;
                    }
                }

                // Dots before last if needed
                if (params.page < totalPages - 3) {
                    pagHTML += `<span class="pag-dots">...</span>`;
                }

                // Always show last page
                if (totalPages > 1) {
                    if (params.page === totalPages) {
                        pagHTML += `<span class="pag-num pag-active">${totalPages}</span>`;
                    } else {
                        pagHTML += `<a href="${buildUrl(params, totalPages)}" class="pag-num">${totalPages}</a>`;
                    }
                }

                pagHTML += '</div>';

                // Next
                if (params.page < totalPages) {
                    pagHTML += `<a href="${buildUrl(params, params.page + 1)}" class="pag-next">Next ›</a>`;
                }
            }
            document.getElementById("pagination").innerHTML = pagHTML;
            window.scrollTo(0, 0);
        }

        loadPage();
    </script>
</body>
</html>
